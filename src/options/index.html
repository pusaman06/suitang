<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>随堂 设置</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #10131c;
        color: #e8ebf4;
        font: 14px/1.6 system-ui, "Segoe UI", sans-serif;
      }
      main {
        width: min(560px, calc(100vw - 48px));
        margin: 48px auto;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: #171b27;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .sub {
        margin: 0 0 20px;
        color: #8b93a8;
        font-size: 13px;
      }
      label {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
        color: #c7cee0;
        font-size: 13px;
      }
      label.check {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      label.check input {
        width: auto;
      }
      details.adv {
        margin: 4px 0 18px;
        color: #8b93a8;
        font-size: 13px;
      }
      summary {
        cursor: pointer;
      }
      details.adv label {
        margin-top: 10px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 11px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 9px;
        background: #0e1119;
        color: #e8ebf4;
        font: inherit;
        outline: none;
      }
      input:focus,
      select:focus {
        border-color: #5b7cff;
      }
      button {
        padding: 9px 18px;
        border: 0;
        border-radius: 9px;
        background: linear-gradient(135deg, #4f7cff, #7b5cff);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        min-height: 22px;
        margin: 12px 0 0;
        color: #7dd3a0;
        font-size: 13px;
      }
      .usage {
        margin-top: 26px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .usage h2 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      .usage .hint {
        margin: 0 0 12px;
        color: #8b93a8;
        font-size: 12px;
      }
      details > .hint {
        margin: 6px 0 10px;
        color: #8b93a8;
        font-size: 12px;
        line-height: 1.6;
      }
      .usage-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .usage-card {
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        background: #0e1119;
      }
      .usage-card span {
        display: block;
        color: #8b93a8;
        font-size: 11px;
      }
      .usage-card strong {
        display: block;
        margin-top: 3px;
        font-size: 16px;
        font-weight: 600;
      }
      .budget {
        margin-top: 12px;
      }
      .budget-head {
        display: flex;
        justify-content: space-between;
        color: #8b93a8;
        font-size: 12px;
      }
      .budget-bar {
        height: 6px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: #0e1119;
      }
      .budget-bar span {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4f7cff, #7b5cff);
      }
      .balance-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }
      .cache-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 4px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #cache-summary {
        color: #d7dbe8;
        font-size: 13px;
      }
      #cache-status {
        min-height: 20px;
        margin: 8px 0 0;
        color: #8b93a8;
        font-size: 12px;
      }
      #balance-status {
        min-height: 20px;
        margin: 8px 0 0;
        color: #8b93a8;
        font-size: 12px;
      }

      .diag {
        margin-top: 26px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .diag h2 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      .diag .hint {
        margin: 0 0 12px;
        color: #8b93a8;
        font-size: 12px;
      }
      .diag-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button.ghost {
        background: #232838;
        color: #c7cee0;
        font-weight: 500;
      }
      #diag-log {
        max-height: 220px;
        margin: 12px 0 0;
        overflow: auto;
        padding: 10px 12px;
        border-radius: 9px;
        background: #0e1119;
        color: #9aa4bd;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>随堂</h1>
      <p class="sub">设置只保存在本机浏览器里，不会上传。</p>

      <label>
        DeepSeek API Key
        <input id="api-key" type="password" placeholder="sk-..." autocomplete="off" />
      </label>

      <label>
        视觉模型
        <input id="vision-model" type="text" />
      </label>

      <label>
        文本模型
        <input id="text-model" type="text" />
      </label>

      <label class="check">
        <input id="thinking" type="checkbox" />
        开启 thinking（更慢更贵，回答更稳）
      </label>

      <label class="check">
        <input id="frame-enabled" type="checkbox" />
        提问时附带当前画面
      </label>

      <label class="check">
        <input id="diagnostics" type="checkbox" />
        显示诊断信息（测试用，正式发布前关掉）
      </label>
      <p class="hint">
        打开后，大纲上方会多一行小字，写明这份大纲是靠什么生成的：官方字幕（并注明是人工还是
        B 站 AI 中文）、语音转写、UP 主章节，还是画面截图。
      </p>

      <label>
        语音转写 Key（SiliconFlow，可选）
        <input id="asr-api-key" type="password" placeholder="sk-..." autocomplete="off" />
      </label>

      <label>
        语音转写模型
        <select id="asr-model">
          <option value="FunAudioLLM/SenseVoiceSmall">FunAudioLLM/SenseVoiceSmall</option>
          <option value="TeleAI/TeleSpeechASR">TeleAI/TeleSpeechASR</option>
        </select>
      </label>

      <label class="check">
        <input id="jump-autoplay" type="checkbox" />
        点回答里的时间戳后自动播放（默认保持暂停）
      </label>

      <label>
        上下文窗口（秒，当前时间前后各取这么多）
        <input id="context-window" type="number" min="30" max="300" step="10" />
      </label>

      <label>
        单次回答长度上限（tokens，256–8192）
        <input id="max-tokens" type="number" min="256" max="8192" step="256" />
      </label>

      <label>
        追问时带上最近几轮问答（0–5，0 表示不带）
        <input id="history-turns" type="number" min="0" max="5" step="1" />
      </label>

      <label>
        月度预算（人民币，0 表示不设）
        <input id="monthly-budget" type="number" min="0" step="1" placeholder="0" />
      </label>

      <details class="adv">
        <summary>高级</summary>
        <label>
          API 地址（留空用 https://api.deepseek.com）
          <input id="api-base-url" type="text" placeholder="https://api.deepseek.com" autocomplete="off" />
        </label>
        <label>
          本地 companion 地址
          <input
            id="companion-url"
            type="text"
            placeholder="http://127.0.0.1:8787"
            autocomplete="off"
          />
        </label>
        <p class="hint">看视频不会自动往硬盘写任何东西，问答和字幕只留在浏览器里。</p>
      </details>

      <button id="save">保存</button>
      <p id="status" role="status"></p>

      <section class="usage">
        <h2>用量</h2>
        <p class="hint">按 DeepSeek 公开单价估算，实际扣费以账单为准。</p>
        <div class="usage-grid">
          <div class="usage-card">
            <span>本月花费</span>
            <strong id="usage-month">¥0.00</strong>
          </div>
          <div class="usage-card">
            <span>累计花费</span>
            <strong id="usage-total">¥0.00</strong>
          </div>
        </div>
        <div class="budget">
          <div class="budget-head">
            <span>月度预算</span>
            <span id="budget-label">未设置</span>
          </div>
          <div class="budget-bar"><span id="budget-fill"></span></div>
        </div>
        <div class="balance-row">
          <button id="refresh-balance" class="ghost" type="button">刷新余额</button>
          <span id="balance-value">未读取</span>
        </div>
        <p id="balance-status" role="status"></p>
      </section>

      <section class="cache">
        <h2>缓存</h2>
        <p class="hint">看过的视频，字幕、转写、大纲和问答只留在浏览器里，方便回头接着看。点「清空全部缓存」会把这些一起删掉。</p>
        <div class="cache-row">
          <span id="cache-summary">统计中…</span>
          <button id="cache-clear" class="ghost" type="button">清空全部缓存</button>
        </div>
        <p id="cache-status" role="status"></p>
      </section>

      <section class="diag">
        <h2>诊断</h2>
        <p class="hint">这两个按钮用来验证扩展与 B 站链路；先打开一个视频页。</p>
        <div class="diag-actions">
          <button id="diag-ping" class="ghost">测试后台连接</button>
          <button id="diag-sub" class="ghost">测试字幕（前 10 条）</button>
        </div>
        <pre id="diag-log"></pre>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

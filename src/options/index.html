<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Tutor 设置</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #10131c;
        color: #e8ebf4;
        font: 14px/1.6 system-ui, "Segoe UI", sans-serif;
      }
      main {
        width: min(560px, calc(100vw - 48px));
        margin: 48px auto;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: #171b27;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .sub {
        margin: 0 0 20px;
        color: #8b93a8;
        font-size: 13px;
      }
      label {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
        color: #c7cee0;
        font-size: 13px;
      }
      label.check {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      label.check input {
        width: auto;
      }
      details.adv {
        margin: 4px 0 18px;
        color: #8b93a8;
        font-size: 13px;
      }
      summary {
        cursor: pointer;
      }
      details.adv label {
        margin-top: 10px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 11px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 9px;
        background: #0e1119;
        color: #e8ebf4;
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: #5b7cff;
      }
      button {
        padding: 9px 18px;
        border: 0;
        border-radius: 9px;
        background: linear-gradient(135deg, #4f7cff, #7b5cff);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        min-height: 22px;
        margin: 12px 0 0;
        color: #7dd3a0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Video Tutor</h1>
      <p class="sub">设置只保存在本机浏览器里，不会上传。</p>

      <label>
        DeepSeek API Key
        <input id="api-key" type="password" placeholder="sk-..." autocomplete="off" />
      </label>

      <label>
        视觉模型
        <input id="vision-model" type="text" />
      </label>

      <label>
        文本模型
        <input id="text-model" type="text" />
      </label>

      <label class="check">
        <input id="thinking" type="checkbox" />
        开启 thinking（更慢更贵，回答更稳）
      </label>

      <label>
        上下文窗口（秒，当前时间前后各取这么多）
        <input id="context-window" type="number" min="30" max="300" step="10" />
      </label>

      <details class="adv">
        <summary>高级</summary>
        <label>
          API 地址（留空用 https://api.deepseek.com）
          <input id="api-base-url" type="text" placeholder="https://api.deepseek.com" autocomplete="off" />
        </label>
      </details>

      <button id="save">保存</button>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
